name: nodax-ai
region: nyc
services:
  - name: nodax
    github:
      repo: musteqeem/XADON_AI
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    run_command: npm start
    http_port: 3000
    health_check:
      http_path: /health
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: SESSION_DIR
        value: runtime/sessions
      - key: DATA_FILE
        value: runtime/nodax.json
