app = "nodax-ai-whatsapp"
primary_region = "ams"

[build]
  [build.args]
    NODE_VERSION = "20"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[mounts]
  source = "nodax_state"
  destination = "/app/runtime"
