services:
  - type: web
    name: nodax-ai-whatsapp
    env: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: nodax-state
      mountPath: /opt/render/project/src/runtime
      sizeGB: 1
    envVars:
      - key: SESSION_DIR
        value: runtime/sessions
      - key: DATA_FILE
        value: runtime/nodax.json
